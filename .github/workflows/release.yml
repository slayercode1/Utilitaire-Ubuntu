name: Release signée

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TAG: ''
      CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}

    steps:
      - name: Extraire les sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Calculer une version croissante pour ce push
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<EOF
          $BASE_VERSION
          EOF
          RELEASE_VERSION="$MAJOR.$MINOR.$((PATCH + GITHUB_RUN_NUMBER))"
          npm version "$RELEASE_VERSION" --no-git-tag-version
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Tester et construire les artefacts auto-actualisables
        run: npm run verify && npm run release:linux

      - name: Préparer les artefacts, métadonnées et checksums
        run: |
          mkdir release
          find out/builder -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name 'latest-linux.yml' \) \
            -exec cp -t release {} +
          test "$(find release -maxdepth 1 -type f | wc -l)" -ge 3
          cd release
          sha256sum *.deb *.AppImage latest-linux.yml > SHA256SUMS

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signer et vérifier les checksums avec OIDC
        run: |
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
          cosign verify-blob \
            --bundle release/SHA256SUMS.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/SHA256SUMS

      - name: Attester la provenance des artefacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json

      - name: Publier une nouvelle release immuable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes release/*
