name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Extraire les sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier le code
        run: npm run verify

      - name: Vérifier le paquet et ses neuf fuses
        run: npm run package

  e2e:
    # Parcours réels dans Electron : lancement, IPC, clavier, persistance.
    # Le serveur X virtuel remplace l'écran absent du runner ; les tests
    # visuels (@regression) restent locaux, leurs captures dépendant des
    # polices et du rendu de la machine de référence.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Extraire les sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Installer le serveur X virtuel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Construire l'application
        run: npm run build

      - name: Tests E2E Electron
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e

      - name: Conserver les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports-e2e
          path: |
            playwright-report
            test-results
          retention-days: 7
