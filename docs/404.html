<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests"
    />
    <!-- GitHub Pages sert cette page pour toute adresse inconnue, à n'importe
         quelle profondeur : les ressources sont donc appelées en absolu. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/Utilitaire-Ubuntu/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/Utilitaire-Ubuntu/assets/finder-icon.png" />
    <link rel="apple-touch-icon" href="/Utilitaire-Ubuntu/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/Utilitaire-Ubuntu/styles.css" />
    <title>Page introuvable — Finder</title>
  </head>
  <body>
    <main class="not-found">
      <a class="brand" href="/Utilitaire-Ubuntu/">
        <img src="/Utilitaire-Ubuntu/assets/finder-icon.png" alt="" width="28" height="28" />
        <span>Finder</span>
      </a>
      <p class="not-found-code">Erreur 404</p>
      <h1>Page introuvable</h1>
      <p class="not-found-text">
        Cette adresse ne mène à aucune page du site Finder. Elle a peut-être changé, ou contient une
        faute de frappe.
      </p>
      <div class="hero-actions">
        <a class="button button-primary" href="/Utilitaire-Ubuntu/">Retour à l’accueil</a>
        <a
          class="button button-secondary"
          href="https://github.com/slayercode1/Utilitaire-Ubuntu/releases/latest"
        >
          Télécharger Finder
        </a>
      </div>
    </main>
  </body>
</html>
