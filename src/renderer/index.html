<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- SÉCURITÉ : Content Security Policy renforcée -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: file:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';"
    />
    <!-- SÉCURITÉ : Headers additionnels -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <title>Finder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="search-box">
        <div class="search-input-wrapper">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Rechercher"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Rechercher une application, un fichier ou un paramètre"
            aria-autocomplete="list"
            aria-controls="resultsContainer"
          />
          <div
            class="calculation-result"
            id="calculationResult"
            aria-live="polite"
          ></div>
        </div>
        <div
          class="results-container"
          id="resultsContainer"
          role="listbox"
          aria-label="Résultats"
        ></div>
        <div class="index-counter" id="indexCounter" aria-live="polite"></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
